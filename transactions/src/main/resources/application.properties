spring.application.name=ntt_transactions
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

lombok.experimental.superBuilder=true

spring.r2dbc.url=r2dbc:postgresql://172.24.253.109:5432/postgres
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=30m

spring.rabbitmq.host=172.24.253.109
spring.rabbitmq.username=vcjimenez
spring.rabbitmq.password=admin

spring.cloud.function.definition=deleteAccountReceiver,statusAccountReceiver

spring.cloud.stream.bindings.deleteAccountReceiver-in-0.destination=customer_exchange
spring.cloud.stream.bindings.deleteAccountReceiver-in-0.group=account_customer_queue
spring.cloud.stream.rabbit.bindings.deleteAccountReceiver-in-0.consumer.bindQueue=true
spring.cloud.stream.rabbit.bindings.deleteAccountReceiver-in-0.consumer.declareExchange=true
spring.cloud.stream.rabbit.bindings.deleteAccountReceiver-in-0.consumer.queueNameGroupOnly=true

spring.cloud.stream.bindings.statusAccountReceiver-in-0.destination=customer_exchange
spring.cloud.stream.bindings.statusAccountReceiver-in-0.group=account_customer_queue
spring.cloud.stream.rabbit.bindings.statusAccountReceiver-in-0.consumer.bindQueue=true
spring.cloud.stream.rabbit.bindings.statusAccountReceiver-in-0.consumer.declareExchange=true
spring.cloud.stream.rabbit.bindings.statusAccountReceiver-in-0.consumer.queueNameGroupOnly=true

spring.cloud.stream.bindings.sendIdReceiveRef-out-0.destination=customer_exchange


server.port=8081
