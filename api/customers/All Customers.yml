info:
  name: All Customers
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/api/v1/customers
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 200\", function () {\r

        \    expect(res.getStatus()).to.equal(200);\r

        });\r

        test(\"Response is an array\", function() {\r

        \   expect(res.getBody()).to.be.an(\"array\");\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
